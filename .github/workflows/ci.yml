name: CI

on:
  push:
    branches: [main, windows-support]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Show toolchain
        run: |
          python --version
          node --version

      - name: Run project checks
        run: python tools/check_project.py

      - name: Build and smoke-test Docker image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker build -t local-ops-ci .
          docker run -d --name local-ops-ci -p 127.0.0.1:9600:9600 local-ops-ci
          trap 'docker rm -f local-ops-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9600/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs local-ops-ci
          exit 1

  windows-exe:
    name: Build Windows EXE
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install locked build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build one-file executable
        shell: pwsh
        run: |
          python tools/gen_ico.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller "总控台.spec" --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 -LiteralPath "dist\总控台.exe"

      - name: Smoke-test Windows executable
        shell: pwsh
        run: .\tools\smoke_exe.ps1 -ExePath ".\dist\总控台.exe" -Port 9609

