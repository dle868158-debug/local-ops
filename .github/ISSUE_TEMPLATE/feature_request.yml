name: 功能建议
description: 提议新的本地服务管理或自动化能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述具体使用场景，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 适用范围
      options:
        - Windows EXE
        - 源码运行
        - Docker
        - 全平台
    validations:
      required: true
